<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZenFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>ZENFLOW</h1>

  <div id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="settings-close-button" type="button" aria-label="Close settings">✕</button>
    </div>
    <div class="settings-row">
      <label for="focus-input">Focus minutes:</label>
      <input id="focus-input" type="number" min="1" value="25" />
    </div>
    <div class="settings-row">
      <label for="short-break-input">Short break minutes:</label>
      <input id="short-break-input" type="number" min="1" value="5" />
    </div>
    <div class="settings-row">
      <label for="long-break-input">Long break minutes:</label>
      <input id="long-break-input" type="number" min="1" value="15" />
    </div>
    <div class="settings-row">
      <label for="cycles-input">Pomodoros before long break:</label>
      <input id="cycles-input" type="number" min="1" value="4" />
    </div>
    <div class="settings-row">
      <div class="background-toggle-row">
        <input id="background-image-toggle" type="checkbox" checked aria-label="Use background image" />
        <label for="background-image-toggle">Background image</label>
      </div>
      <div class="background-counter">
        <div class="background-selection">
          <div class="background-counter-controls">
            <button id="background-prev" type="button" aria-label="Previous background">◀</button>
            <img id="background-preview" class="background-preview" src="images/1.png" alt="Selected background preview" />
            <button id="background-next" type="button" aria-label="Next background">▶</button>
          </div>
          <span id="background-selection-label">� Study Room</span>
        </div>
      </div>
    </div>
    <div class="settings-row" id="background-color-row" style="display:none">
      <label for="background-color-input">Background color:</label>
      <input id="background-color-input" type="color" value="#ffffff" />
    </div>
    <div class="settings-row">
      <label for="text-color-input">Text color:</label>
      <input id="text-color-input" type="color" value="#334155" />
    </div>
  </div>

  <div id="main-content">
    <p id="quote-text" class="quote-text">The only limit to our realization of tomorrow will be our doubts of today. - Franklin D. Roosevelt</p>
    <div id="timer-container">
      <div id="timer-main">
        <h2 id="timer-display">25:00</h2>
        <div id="timer-icon">💻</div>
      </div>
      <div id="timer-actions">
        <button id="focus-button" type="button">Start Focus</button>
        <button id="short-break-button" type="button">Short Break</button>
        <button id="long-break-button" type="button">Long Break</button>
      </div>
    </div>
  </div>

  <button id="settings-toggle" type="button" aria-label="Open settings">⚙️</button>
  <button id="sound-toggle" type="button" aria-label="Open sound options">🎵</button>

  <div id="sound-panel" class="sound-panel" aria-hidden="true">
    <div class="sound-header">
      <button id="sound-close-button" type="button" aria-label="Close sound options">✕</button>
    </div>
    <div class="sound-option-grid">
      <div class="sound-option-entry">
        <div class="sound-option-label">Sound</div>
        <div class="sound-counter">
          <button id="sound-prev" type="button" aria-label="Previous sound">◀</button>
          <span id="sound-selection-label">🌊 Ocean</span>
          <button id="sound-next" type="button" aria-label="Next sound">▶</button>
        </div>
      </div>
      <div class="sound-option-entry">
        <div class="sound-option-label">Volume</div>
        <input id="sound-volume" class="sound-volume-slider" type="range" min="0" max="100" value="0" />
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
