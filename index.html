<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZenFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>ZenFlow Pomodoro</h1>

  <div id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="settings-close-button" type="button" aria-label="Close settings">✕</button>
    </div>
    <div class="settings-row">
      <label for="focus-input">Focus minutes:</label>
      <input id="focus-input" type="number" min="1" value="25" />
    </div>
    <div class="settings-row">
      <label for="short-break-input">Short break minutes:</label>
      <input id="short-break-input" type="number" min="1" value="5" />
    </div>
    <div class="settings-row">
      <label for="long-break-input">Long break minutes:</label>
      <input id="long-break-input" type="number" min="1" value="15" />
    </div>
    <div class="settings-row">
      <label for="cycles-input">Pomodoros before long break:</label>
      <input id="cycles-input" type="number" min="1" value="4" />
    </div>
    <div class="settings-row">
      <label for="complimentary-toggle">Use complementary text color:</label>
      <input id="complimentary-toggle" type="checkbox" checked />
    </div>
    <div class="settings-row">
      <label>Background image:</label>
      <div class="background-option-grid">
        <button type="button" class="background-option active" data-bg="1.png" aria-pressed="true">
          <img src="images/1.png" alt="Sunlit haven background" />
          <span>Sunlit haven</span>
        </button>
        <button type="button" class="background-option" data-bg="2.png" aria-pressed="false">
          <img src="images/2.png" alt="Cozy nook background" />
          <span>Cozy nook</span>
        </button>
        <button type="button" class="background-option" data-bg="none" aria-pressed="false">
          <span>Off</span>
        </button>
      </div>
    </div>
    <div class="settings-row">
      <label for="background-color-input">Background color:</label>
      <input id="background-color-input" type="color" value="#ffffff" />
    </div>
  </div>

  <div id="main-content">
    <div id="mode-buttons">
    <button id="focus-mode" type="button">Focus</button>
    <button id="short-break-mode" type="button">Short Break</button>
    <button id="long-break-mode" type="button">Long Break</button>
  </div>

  <div id="timer-container">
    <div id="timer-main">
      <h2 id="timer-display">25:00</h2>
      <div id="timer-icon">💻</div>
    </div>
    <div id="timer-actions">
      <button id="toggle-button" type="button">Start</button>
      <button id="reset-button" type="button">Reset</button>
    </div>
  </div>
  </div>

  <button id="settings-toggle" type="button" aria-label="Open settings">⚙️</button>

  <script src="timer.js"></script>
</body>
</html>
